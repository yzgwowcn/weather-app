<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="海南海边旅行 EC 主判断：EC 集合晴好率、分层云图与多模型交叉验证查询">
  <meta name="theme-color" content="#0c1626">
  <title>晴海 · 海南旅行天气判断</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-mood="neutral">
  <canvas id="rain-layer" aria-hidden="true"></canvas>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="#top" aria-label="晴海首页"><span class="brand-mark">◐</span>晴海</a>
      <div class="header-right">
        <p class="header-note">海南旅行天气判断 / Open-Meteo</p>
        <a class="xhs-link" href="https://xhslink.cn/m/4BS8N8iCK3F" target="_blank" rel="noopener" aria-label="我的小红书主页">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M12 3.8C9.8 2.3 6.7 2.3 4.3 3.1c-.7.2-1.2.8-1.2 1.5v13c0 .8.7 1.4 1.5 1.2 2.3-.6 4.4-.4 6.2.8.5.3 1.1.3 1.6 0 1.8-1.2 3.9-1.4 6.2-.8.8.2 1.5-.4 1.5-1.2v-13c0-.7-.5-1.3-1.2-1.5-2.4-.8-5.5-.8-7.7.7-.1.1-.2.1-.3 0z"/></svg>
          我的小红书
        </a>
      </div>
    </header>

    <main id="top">
      <section class="intro">
        <p class="eyebrow">WEATHER INTELLIGENCE · HAINAN</p>
        <h1>看见晴天，<br><em>再出发。</em></h1>
        <p class="intro-copy">以日间云量为主，结合降水、风力与多模型分歧，为海边行程判断晴好窗口。</p>
      </section>

      <section class="workspace" aria-label="查询控制">
        <div class="workspace-section destination-field">
          <span class="field-label">目的地</span>
          <div id="dest-list" class="dest-list" role="group" aria-label="选择目的地"></div>
        </div>
        <div class="workspace-section horizon-field">
          <span class="field-label">预报范围</span>
          <div id="days-group" class="days-group" role="group" aria-label="选择预报范围">
            <button type="button" class="days-btn" data-days="3">3 天</button>
            <button type="button" class="days-btn active" data-days="7">7 天</button>
            <button type="button" class="days-btn" data-days="14">14 天</button>
          </div>
        </div>
        <button id="query-btn" class="query-btn" type="button">更新判断 <span aria-hidden="true">↗</span></button>
      </section>

      <div id="loading" class="loading hidden" role="status"><span class="spinner"></span>正在汇集最新模型数据</div>
      <section id="result" class="result" aria-live="polite"></section>
    </main>

    <footer class="footer">
      <p>数据来自 <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>。以 ECMWF（EC）为主判断：EC 集合晴好率是 51 个成员满足页面条件的比例，GFS、JMA、CMA 仅作交叉验证，模型分歧不是历史准确率证明。</p>
      <p>台风、大风、暴雨、乘船与涉海活动，请以当地气象台、码头和景区通知为准。</p>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/metrics.js"></script>
  <script src="js/render.js"></script>
  <script src="js/rain.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
