<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的账户 · 晴海</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-page { max-width: 420px; margin: 40px auto; padding: 0 16px; }
    .auth-card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    .account-row { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 14px; }
    .account-row .k { opacity: 0.75; flex-shrink: 0; }
    .account-row .v { word-break: break-all; text-align: right; }
    .account-row .v .link-btn { background: none; border: none; color: inherit; text-decoration: underline; cursor: pointer; font-size: 13px; opacity: 0.85; padding: 0; }
    .uname-edit { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.1); }
    .uname-edit label { display: block; font-size: 13px; margin-bottom: 6px; opacity: 0.85; }
    .uname-edit input {
      width: 100%; box-sizing: border-box; padding: 10px 12px; margin-bottom: 10px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.25); color: inherit; font-size: 15px;
    }
    .uname-edit input:focus { outline: none; border-color: rgba(255,255,255,0.5); }
    #uname-save {
      width: 100%; padding: 11px 0; margin-bottom: 8px; cursor: pointer;
      border: none; border-radius: 8px; font-size: 15px;
      background: linear-gradient(135deg, #f0b45a, #e08a3c); color: #1a1a1a; font-weight: 600;
    }
    #uname-cancel {
      width: 100%; padding: 11px 0; cursor: pointer;
      border: none; border-radius: 8px; font-size: 15px;
      background: rgba(255,255,255,0.14); color: inherit;
    }
    #uname-cancel:hover { background: rgba(255,255,255,0.22); }
    .auth-msg { margin-top: 14px; font-size: 13px; min-height: 18px; }
    .auth-msg.error { color: #ff8f8f; }
    .auth-submit {
      width: 100%; padding: 11px 0; margin-top: 18px; cursor: pointer;
      border: none; border-radius: 8px; font-size: 15px;
      background: rgba(255,255,255,0.14); color: inherit;
    }
    .auth-submit:hover { background: rgba(255,255,255,0.22); }
    .auth-hint { margin-top: 14px; font-size: 12px; opacity: 0.7; line-height: 1.6; }
    .auth-back { display: inline-block; margin-top: 16px; font-size: 13px; opacity: 0.85; }
    .auth-back a { color: inherit; }
  </style>
</head>
<body data-mood="neutral">
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="index.html" aria-label="晴海首页"><span class="brand-mark">◐</span>晴海</a>
    </div>
  </header>
  <div class="page-shell">
    <main class="auth-page">
      <div class="auth-card">
        <h2 style="margin:0 0 16px;font-size:18px;">我的账户</h2>
        <div class="account-row"><span class="k">邮箱</span><span class="v" id="acc-email">—</span></div>
        <div class="account-row"><span class="k">用户名</span><span class="v" id="acc-username">—</span></div>
        <div class="account-row"><span class="k">当前等级</span><span class="v" id="acc-plan">—</span></div>
        <div class="account-row"><span class="k">账户 ID（UID）</span><span class="v" id="acc-uid" style="font-family:monospace;">—</span></div>
        <div class="uname-edit" id="uname-edit">
          <label for="uname-input">用户名（2-20 位中文/字母/数字/下划线）</label>
          <input type="text" id="uname-input" maxlength="20" placeholder="建议使用小红书昵称">
          <button type="button" id="uname-save">保存</button>
          <button type="button" id="uname-cancel">取消</button>
        </div>
        <div id="acc-msg" class="auth-msg" role="status"></div>
        <button type="button" class="auth-submit" id="acc-logout">退出登录</button>
        <p class="auth-hint">UID（Supabase user_id）是您在晴海的唯一身份。</p>
      </div>
      <p class="auth-back"><a href="index.html">← 返回首页</a></p>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="vendor/supabase.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/user.js"></script>
  <script>
    (function () {
      'use strict';
      var msgEl = document.getElementById('acc-msg');
      function setMsg(text, isError) {
        msgEl.textContent = text || '';
        msgEl.className = 'auth-msg' + (isError ? ' error' : '');
      }

      function fmtDate(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        var p = function (n) { return (n < 10 ? '0' : '') + n; };
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
      }

      var usernameEl = document.getElementById('acc-username');
      var unameEdit = document.getElementById('uname-edit');
      var unameInput = document.getElementById('uname-input');

      function showUnameEdit() {
        unameEdit.style.display = 'block';
        unameInput.focus();
      }
      function hideUnameEdit() {
        unameEdit.style.display = 'none';
      }

      (async function main() {
        if (!Auth.isReady()) { setMsg('认证服务未配置（构建时未注入 SUPABASE 环境变量），请联系管理员。', true); return; }
        var user = await Auth.refreshUser();
        if (!user) {
          setMsg('未登录，正在跳转到登录页…');
          setTimeout(function () { window.location.href = 'auth.html'; }, 800);
          return;
        }
        document.getElementById('acc-email').textContent = user.email || '—';
        document.getElementById('acc-uid').textContent = user.id;

        // 加载用户名（profile 行存在但 username 为 null 时也视为未设置）
        var profile = await User.getProfile();
        if (profile.ok && profile.profile && profile.profile.username) {
          usernameEl.textContent = profile.profile.username;
          unameInput.value = profile.profile.username;
        } else {
          usernameEl.innerHTML = '未设置 <button type="button" class="link-btn" id="uname-set">设置</button>';
          document.getElementById('uname-set').addEventListener('click', showUnameEdit);
        }
        usernameEl.innerHTML += ' <button type="button" class="link-btn" id="uname-edit-btn">修改</button>';
        document.getElementById('uname-edit-btn').addEventListener('click', showUnameEdit);

        // 当前等级（三档：免费版 / Pro / Ultra；过期显示「已过期」）
        var status = User.getPlanStatus(profile.ok ? profile.profile : null);
        var PLAN_LABEL = { free: '免费版', pro: 'Pro', ultra: 'Ultra' };
        var planText = PLAN_LABEL[status.plan] || '免费版';
        if (status.plan === 'pro' || status.plan === 'ultra') {
          planText += ' · 至 ' + fmtDate(status.proExpiresAt);
        } else if (status.expired) {
          planText = '免费版（' + (PLAN_LABEL[status.rawPlan] || '') + ' 已过期）';
        }
        document.getElementById('acc-plan').textContent = planText;

        // 保存用户名
        document.getElementById('uname-save').addEventListener('click', async function () {
          var name = unameInput.value.trim();
          var r = await User.setUsername(name);
          if (!r.ok) { setMsg(r.message, true); return; }
          usernameEl.childNodes[0].textContent = name; // 更新显示值（保留修改按钮）
          hideUnameEdit();
          setMsg('用户名已更新');
        });
        document.getElementById('uname-cancel').addEventListener('click', hideUnameEdit);

        // 退出登录
        var logoutBtn = document.getElementById('acc-logout');
        logoutBtn.addEventListener('click', async function () {
          logoutBtn.disabled = true;
          await Auth.signOut();
          setMsg('已退出登录，正在跳转…');
          setTimeout(function () { window.location.href = 'index.html'; }, 600);
        });
      })();
    })();
  </script>
</body>
</html>
