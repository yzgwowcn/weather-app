<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账户登录与注册 · 晴海</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 认证页：复用站点毛玻璃视觉语言，独立样式不改动 style.css */
    .auth-page { width: min(100%, 468px); margin: 44px auto; padding: 0 16px; }
    .auth-card {
      position: relative; overflow: hidden;
      background: linear-gradient(145deg, rgba(38,56,82,.78), rgba(17,29,48,.9));
      backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(160,197,244,.2); border-radius: 22px; padding: 28px;
      box-shadow: 0 22px 60px rgba(3,10,22,.34), inset 0 1px 0 rgba(255,255,255,.08);
    }
    .auth-card::before {
      content: ''; position: absolute; width: 220px; height: 220px; top: -145px; right: -90px;
      border-radius: 50%; background: radial-gradient(circle, rgba(106,169,250,.2), transparent 68%); pointer-events: none;
    }
    .auth-heading { position: relative; margin: 0; color: #f7fbff; font-size: 25px; line-height: 1.25; letter-spacing: -.02em; }
    .auth-subtitle { position: relative; min-height: 42px; margin: 8px 0 20px; color: rgba(222,233,246,.72); font-size: 13px; line-height: 1.6; }
    .auth-tabs { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 24px; padding: 4px; border-radius: 13px; background: rgba(5,14,27,.32); }
    .auth-tab {
      min-height: 38px; padding: 8px 5px; text-align: center; cursor: pointer;
      border: 1px solid transparent; border-radius: 10px;
      background: transparent; color: rgba(222,233,246,.72); font-size: 13px; font-weight: 700;
    }
    .auth-tab:hover { color: #fff; background: rgba(255,255,255,.05); }
    .auth-tab.active { color: #fff; background: rgba(103,158,231,.2); border-color: rgba(145,190,247,.28); box-shadow: 0 4px 14px rgba(5,16,32,.15); }
    .auth-field { margin-bottom: 16px; }
    .auth-field label { display: flex; justify-content: space-between; gap: 8px; color: rgba(230,239,249,.88); font-size: 13px; font-weight: 650; margin-bottom: 7px; }
    .auth-field input {
      width: 100%; min-height: 46px; box-sizing: border-box; padding: 11px 13px;
      border-radius: 11px; border: 1px solid rgba(164,195,233,.2);
      background: rgba(4,12,24,.36); color: #f7fbff; font-size: 15px; transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .auth-field input::placeholder { color: rgba(211,225,241,.42); }
    .auth-field input:focus { outline: none; border-color: rgba(127,180,247,.72); background: rgba(4,12,24,.5); box-shadow: 0 0 0 3px rgba(86,145,221,.13); }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 48px; }
    .password-toggle {
      position: absolute; top: 50%; right: 7px; display: grid; place-items: center; width: 36px; height: 36px;
      transform: translateY(-50%); border: 0; border-radius: 9px; background: transparent; color: rgba(221,233,247,.7); cursor: pointer;
    }
    .password-toggle:hover, .password-toggle:focus-visible { color: #fff; background: rgba(125,180,255,.12); outline: none; }
    .eye-icon { position: relative; width: 18px; height: 12px; border: 1.5px solid currentColor; border-radius: 70% 30% 70% 30%; transform: rotate(45deg); }
    .eye-icon::after { content: ''; position: absolute; top: 50%; left: 50%; width: 5px; height: 5px; border-radius: 50%; background: currentColor; transform: translate(-50%, -50%); }
    .password-toggle[aria-pressed="true"] .eye-icon::before { content: ''; position: absolute; z-index: 1; top: 50%; left: -3px; width: 24px; height: 1.5px; background: currentColor; box-shadow: 0 0 0 2px rgba(24,38,58,.9); transform: rotate(-45deg); }
    .auth-submit {
      width: 100%; min-height: 46px; padding: 11px 16px; margin-top: 6px; cursor: pointer;
      border: 1px solid rgba(255,220,158,.3); border-radius: 11px; font-size: 15px;
      background: linear-gradient(135deg, #f4c36e, #e89a4b); color: #18202b; font-weight: 800; box-shadow: 0 8px 22px rgba(210,128,49,.18);
    }
    .auth-submit:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .auth-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-msg { margin-top: 16px; padding: 0; border-radius: 10px; font-size: 13px; min-height: 19px; line-height: 1.55; }
    .auth-msg.error, .auth-msg.ok { padding: 9px 11px; border: 1px solid; }
    .auth-msg.error { color: #ffc0c0; background: rgba(208,70,70,.1); border-color: rgba(255,143,143,.22); }
    .auth-msg.ok { color: #bceac6; background: rgba(70,170,100,.1); border-color: rgba(143,214,160,.2); }
    .auth-hint { margin: 15px 0 0; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.08); color: rgba(218,231,246,.62); font-size: 12px; line-height: 1.6; }
    .cf-turnstile { margin-top: 4px; }
    .auth-code-hint { margin: 0 0 16px; padding: 11px 12px; border: 1px solid rgba(125,180,255,.16); border-radius: 10px; background: rgba(75,130,198,.09); color: rgba(229,239,251,.88); font-size: 13px; line-height: 1.6; word-break: break-all; }
    .auth-code-input { text-align: center; letter-spacing: .28em; font-size: 18px !important; font-variant-numeric: tabular-nums; }
    .auth-resend-row { display: flex; gap: 8px; margin-top: 10px; }
    .auth-secondary {
      flex: 1; padding: 9px 0; cursor: pointer;
      min-height: 42px; border: 1px solid rgba(164,195,233,.18); border-radius: 10px;
      background: rgba(255,255,255,.05); color: rgba(235,242,251,.88); font-size: 13px;
    }
    .auth-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-back { display: inline-block; margin-top: 16px; font-size: 13px; opacity: 0.85; }
    .auth-back a { color: inherit; }
    /* 第三方登录（仅登录 tab 显示） */
    .auth-divider { display: flex; align-items: center; gap: 10px; margin: 18px 0 14px; font-size: 12px; opacity: 0.6; }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.15); }
    .auth-oauth-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 10px 0; margin-bottom: 10px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
      background: rgba(255,255,255,0.06); color: inherit; font-size: 14px; font-family: inherit;
    }
    .auth-oauth-btn:hover { background: rgba(255,255,255,0.12); }
    .auth-oauth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-oauth-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .auth-step-label { margin: -4px 0 14px; color: #9dc8ff; font-size: 12px; font-weight: 800; letter-spacing: .08em; }
    @media (max-width: 520px) {
      .auth-page { margin: 22px auto; padding: 0 12px; }
      .auth-card { padding: 22px 18px; border-radius: 18px; }
      .auth-heading { font-size: 23px; }
      .auth-tabs { margin-bottom: 20px; }
    }
    @media (prefers-reduced-motion: reduce) { .auth-submit, .auth-field input { transition: none; } }
  </style>
</head>
<body data-mood="neutral">
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="index.html" aria-label="晴海首页"><span class="brand-mark">◐</span>晴海</a>
    </div>
  </header>
  <div class="page-shell">
    <main class="auth-page">
      <div class="auth-card">
        <h1 class="auth-heading" id="auth-heading">欢迎回来</h1>
        <p class="auth-subtitle" id="auth-subtitle">登录后同步收藏地点与旅行偏好。</p>
        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab active" data-mode="login" role="tab" aria-selected="true">登录</button>
          <button type="button" class="auth-tab" data-mode="signup" role="tab" aria-selected="false">注册</button>
          <button type="button" class="auth-tab" data-mode="forgot" role="tab" aria-selected="false">找回密码</button>
        </div>

        <!-- 登录 -->
        <form id="login-form" class="auth-form" novalidate>
          <div class="auth-field">
            <label for="login-email">邮箱</label>
            <input type="email" id="login-email" autocomplete="email" required>
          </div>
          <div class="auth-field">
            <label for="login-password">密码</label>
            <div class="password-wrap"><input type="password" id="login-password" autocomplete="current-password" required><button type="button" class="password-toggle" data-password-toggle="login-password" aria-label="显示密码" aria-pressed="false"><span class="eye-icon" aria-hidden="true"></span></button></div>
          </div>
          <button type="submit" class="auth-submit" id="login-submit">登录</button>
        </form>

        <!-- 第三方登录（仅登录 tab 显示；OAuth 由 Supabase 托管，走 auth/callback.html 回跳） -->
        <div id="oauth-panel" class="auth-oauth">
          <div class="auth-divider"><span>或</span></div>
          <button type="button" class="auth-oauth-btn" id="oauth-google">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            使用 Google 登录
          </button>
          <button type="button" class="auth-oauth-btn" id="oauth-github">
            <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
            使用 GitHub 登录
          </button>
        </div>

        <!-- 注册（含 Turnstile 人机验证；两步：资料 → 邮箱验证码） -->
        <form id="signup-form" class="auth-form hidden" novalidate>
          <div id="signup-step1">
            <div class="auth-field">
              <label for="signup-email">邮箱</label>
              <input type="email" id="signup-email" autocomplete="email" required>
            </div>
            <div class="auth-field">
              <label for="signup-username">用户名（可选，建议使用小红书昵称）</label>
              <input type="text" id="signup-username" maxlength="20" autocomplete="username" placeholder="2-20 位中文/字母/数字/下划线">
              <p style="margin:6px 0 0;font-size:12px;opacity:.7;">💡 建议使用您的小红书用户名称，方便识别</p>
            </div>
            <div class="auth-field">
              <label for="signup-password">密码（至少 6 位）</label>
              <div class="password-wrap"><input type="password" id="signup-password" minlength="6" autocomplete="new-password" required><button type="button" class="password-toggle" data-password-toggle="signup-password" aria-label="显示密码" aria-pressed="false"><span class="eye-icon" aria-hidden="true"></span></button></div>
            </div>
            <div class="auth-field">
              <label for="signup-password2">确认密码</label>
              <div class="password-wrap"><input type="password" id="signup-password2" minlength="6" autocomplete="new-password" required><button type="button" class="password-toggle" data-password-toggle="signup-password2" aria-label="显示密码" aria-pressed="false"><span class="eye-icon" aria-hidden="true"></span></button></div>
            </div>
            <div id="turnstile-widget" class="cf-turnstile"></div>
            <button type="submit" class="auth-submit" id="signup-submit">注册</button>
          </div>
          <div id="signup-step2" class="hidden">
            <p class="auth-code-hint">验证码已发送至 <strong id="signup-code-email"></strong>,请查收邮件（含垃圾箱）。</p>
            <div class="auth-field">
              <label for="signup-code">邮箱验证码</label>
              <input type="text" class="auth-code-input" id="signup-code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]{8}" placeholder="8 位数字验证码" required>
            </div>
            <button type="button" class="auth-submit" id="signup-code-submit">验证并完成注册</button>
            <div class="auth-resend-row">
              <button type="button" class="auth-secondary" id="signup-resend">重新发送验证码</button>
              <button type="button" class="auth-secondary" id="signup-back">返回修改</button>
            </div>
          </div>
        </form>

        <!-- 找回密码：填写新密码 → 收取 Recovery OTP → 验证后更新 -->
        <form id="forgot-form" class="auth-form hidden" novalidate>
          <div id="forgot-step1">
            <p class="auth-step-label">第 1 步 · 设置新密码</p>
            <div class="auth-field">
              <label for="forgot-email">账户邮箱</label>
              <input type="email" id="forgot-email" autocomplete="email" placeholder="name@example.com" required>
            </div>
            <div class="auth-field">
              <label for="forgot-password">新密码（至少 6 位）</label>
              <div class="password-wrap"><input type="password" id="forgot-password" minlength="6" autocomplete="new-password" required><button type="button" class="password-toggle" data-password-toggle="forgot-password" aria-label="显示密码" aria-pressed="false"><span class="eye-icon" aria-hidden="true"></span></button></div>
            </div>
            <div class="auth-field">
              <label for="forgot-password2">确认新密码</label>
              <div class="password-wrap"><input type="password" id="forgot-password2" minlength="6" autocomplete="new-password" required><button type="button" class="password-toggle" data-password-toggle="forgot-password2" aria-label="显示密码" aria-pressed="false"><span class="eye-icon" aria-hidden="true"></span></button></div>
            </div>
            <button type="submit" class="auth-submit" id="forgot-submit">发送邮箱验证码</button>
          </div>
          <div id="forgot-step2" class="hidden">
            <p class="auth-step-label">第 2 步 · 验证身份</p>
            <p class="auth-code-hint">8 位验证码已发送至 <strong id="forgot-code-email"></strong>，验证通过后立即更新密码。</p>
            <div class="auth-field">
              <label for="forgot-code">邮箱验证码</label>
              <input type="text" class="auth-code-input" id="forgot-code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]{8}" placeholder="8 位数字验证码" required>
            </div>
            <button type="button" class="auth-submit" id="forgot-code-submit">验证并修改密码</button>
            <div class="auth-resend-row">
              <button type="button" class="auth-secondary" id="forgot-resend">重新发送验证码</button>
              <button type="button" class="auth-secondary" id="forgot-back">返回修改</button>
            </div>
          </div>
        </form>

        <div id="auth-msg" class="auth-msg" role="status"></div>
        <p class="auth-hint hidden" id="auth-hint">您的账户 ID 用于关联收藏与偏好。</p>
      </div>
      <p class="auth-back"><a href="index.html">← 返回首页</a></p>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="vendor/supabase.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/user.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad" async defer></script>
  <script>
    (function () {
      'use strict';
      var $ = function (id) { return document.getElementById(id); };
      var msg = $('auth-msg');
      var hint = $('auth-hint');
      var currentMode = 'login';
      var modeCopy = {
        login: ['欢迎回来', '登录后同步收藏地点与旅行偏好。'],
        signup: ['创建晴海账户', '保存常用地点，让每次天气判断更省心。'],
        forgot: ['重新设置密码', '先设定新密码，再用邮件中的 8 位验证码确认身份。'],
      };

      // 密码显隐：按钮不参与表单提交，状态通过 aria-pressed/aria-label 同步给辅助技术。
      document.querySelectorAll('[data-password-toggle]').forEach(function (button) {
        button.addEventListener('click', function () {
          var input = $(button.dataset.passwordToggle);
          if (!input) return;
          var show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          button.setAttribute('aria-pressed', String(show));
          button.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
          try { input.focus({ preventScroll: true }); } catch (_) { input.focus(); }
        });
      });

      // Turnstile API 加载完成回调（onload 参数触发；兜底处理 API 晚于用户切 tab 的情况）
      window.onTurnstileLoad = function () {
        if (currentMode === 'signup') renderTurnstile();
      };

      function setMsg(text, isError) {
        msg.textContent = text || '';
        msg.className = 'auth-msg' + (isError ? ' error' : text ? ' ok' : '');
      }

      // 未注入 Supabase 配置时整体禁用
      if (!Auth.isReady()) {
        setMsg('认证服务未配置（构建时未注入 SUPABASE 环境变量），请联系管理员。', true);
        ['login-submit', 'signup-submit', 'signup-code-submit', 'forgot-submit', 'forgot-code-submit', 'oauth-google', 'oauth-github'].forEach(function (id) { $(id).disabled = true; });
      }

      // Turnstile 显式渲染（仅注册 tab 需要）
      var turnstileRendered = false;
      var turnstileToken = '';
      var turnstileWidgetEl = $('turnstile-widget');
      function turnstileUnavailable(reason) {
        turnstileWidgetEl.textContent = reason;
        turnstileWidgetEl.style.color = '#ff8f8f';
        turnstileWidgetEl.style.fontSize = '13px';
      }
      function doRender() {
        // 延迟到下一轮事件循环，让注册表单完成从 hidden 到可见的布局
        setTimeout(function () {
          if (turnstileRendered) return;
          if (!turnstileWidgetEl) return;
          // 传元素对象而非字符串选择器：Turnstile 的字符串参数按 CSS 选择器解析，
          // 'turnstile-widget' 无 # 前缀匹配不到容器（实测静默失败），元素对象与手动验证成功路径一致
          turnstile.render(turnstileWidgetEl, {
            sitekey: TURNSTILE_CONFIG.siteKey,
            callback: function (token) { turnstileToken = token; },
            'error-callback': function () {
              // Turnstile 自身失败回调（如域名白名单不匹配、网络错误），据实提示
              turnstileToken = '';
              turnstileUnavailable('人机验证组件出错，请刷新页面重试；若持续出现请检查 Turnstile 站点域名白名单');
            },
            'expired-callback': function () { turnstileToken = ''; },
          });
          turnstileRendered = true;
          // 不做 iframe 超时质检：Turnstile iframe 加载可能慢于 1.5s（首次/网络），
          // 误判后用 textContent 覆盖会毁掉已渲染的 widget（实测复现）；失败由上方 error-callback 反馈
        }, 0);
      }
      function renderTurnstile() {
        if (turnstileRendered) return;
        if (!TURNSTILE_CONFIG || !TURNSTILE_CONFIG.siteKey) {
          turnstileUnavailable('人机验证未配置（TURNSTILE_SITE_KEY 未注入），注册暂不可用');
          return;
        }
        if (String(TURNSTILE_CONFIG.siteKey).indexOf('__TURNSTILE_') === 0) {
          turnstileUnavailable('人机验证未配置（TURNSTILE_SITE_KEY 未注入），注册暂不可用');
          return;
        }
        if (typeof turnstile === 'undefined') {
          // Turnstile API 由 async defer 脚本加载，可能尚未就绪：轮询等待后自动渲染
          var waited = 0;
          var timer = setInterval(function () {
            waited += 500;
            if (typeof turnstile !== 'undefined') {
              clearInterval(timer);
              doRender();
            } else if (waited >= 10000) {
              clearInterval(timer);
              turnstileUnavailable('人机验证组件加载失败（网络被拦截？），请刷新页面重试');
            }
          }, 500);
          return;
        }
        doRender();
      }

      // Tab 切换
      document.querySelectorAll('.auth-tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
          currentMode = tab.dataset.mode;
          document.querySelectorAll('.auth-tab').forEach(function (t) {
            var active = t === tab;
            t.classList.toggle('active', active);
            t.setAttribute('aria-selected', String(active));
          });
          $('auth-heading').textContent = modeCopy[currentMode][0];
          $('auth-subtitle').textContent = modeCopy[currentMode][1];
          $('login-form').classList.toggle('hidden', currentMode !== 'login');
          $('signup-form').classList.toggle('hidden', currentMode !== 'signup');
          $('forgot-form').classList.toggle('hidden', currentMode !== 'forgot');
          $('oauth-panel').classList.toggle('hidden', currentMode !== 'login');
          setMsg('');
          hint.classList.toggle('hidden', currentMode !== 'signup');
          if (currentMode === 'signup') renderTurnstile();
        });
      });

      // 登录
      $('login-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        setMsg('');
        var btn = $('login-submit');
        btn.disabled = true;
        var r = await Auth.signIn($('login-email').value, $('login-password').value);
        btn.disabled = false;
        if (!r.ok) { setMsg(r.message, true); return; }
        setMsg('登录成功，正在跳转…');
        setTimeout(function () { window.location.href = 'account.html'; }, 600);
      });

      // 第三方登录（Google / GitHub）：supabase-js 成功后自动跳转授权页，此处处理失败提示与兜底跳转
      function startOAuth(provider) {
        setMsg('');
        var btn = provider === 'google' ? $('oauth-google') : $('oauth-github');
        btn.disabled = true;
        Auth.signInWithOAuth(provider).then(function (r) {
          btn.disabled = false;
          if (!r.ok) { setMsg(r.message, true); return; }
          if (r.url) window.location.href = r.url; // 个别环境 supabase-js 未自动跳转时兜底
        }).catch(function () {
          btn.disabled = false;
          setMsg('网络异常，请重试', true);
        });
      }
      $('oauth-google').addEventListener('click', function () { startOAuth('google'); });
      $('oauth-github').addEventListener('click', function () { startOAuth('github'); });

      // ---- 注册第二步：邮箱验证码 ----
      var signupEmail = '';
      var resendTimer = null;

      // 展示验证码步骤（第一步提交成功、验证码已发送后调用）
      // 注意：只能隐藏 signup-step1，不能隐藏整个 signup-form——
      // step2 是 form 的子元素，form 加 hidden 后 step2 即使无 hidden 也不可见（实测 bug）
      function showSignupStep2(email) {
        signupEmail = email.trim().toLowerCase();
        $('signup-step1').classList.add('hidden');
        $('signup-step2').classList.remove('hidden');
        $('signup-code-email').textContent = signupEmail;
        $('signup-code').value = '';
        $('signup-code').focus();
        startResendCountdown();
      }

      // 重新发送 60s 倒计时（与 Supabase 同邮箱发送窗口一致）
      function startResendCountdown() {
        var btn = $('signup-resend');
        var remain = 60;
        btn.disabled = true;
        btn.textContent = '重新发送（' + remain + 's）';
        clearInterval(resendTimer);
        resendTimer = setInterval(function () {
          remain -= 1;
          if (remain <= 0) {
            clearInterval(resendTimer);
            btn.disabled = false;
            btn.textContent = '重新发送验证码';
          } else {
            btn.textContent = '重新发送（' + remain + 's）';
          }
        }, 1000);
      }

      // Turnstile token → 服务端 siteverify（第一步提交与重发验证码共用）
      async function verifyTurnstileToken() {
        if (!turnstileToken) return { ok: false, message: '请先完成人机验证' };
        var vr = await fetch('/api/verify-turnstile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: turnstileToken }),
        }).then(async function (r) {
          var data = await r.json().catch(function () { return {}; });
          return { ok: r.ok, status: r.status, success: data.success, error: data.error, codes: data.codes };
        }).catch(function () { return { ok: false, status: 0, success: false }; });
        if (!vr.ok) {
          return { ok: false, message: '人机验证服务异常（HTTP ' + vr.status + '）：请确认 Vercel 已配置 CLOUDFLARE_TURNSTILE_SECRET 并重新部署' };
        }
        if (!vr.success) {
          var detail = vr.error ? ' (' + vr.error + (vr.codes && vr.codes.length ? ' ' + vr.codes.join(',') : '') + ')' : '';
          if (turnstileRendered) turnstile.reset(turnstileWidgetEl); // 元素对象（字符串参数会被当 CSS 选择器）
          return { ok: false, message: '人机验证未通过' + detail + '，请重试' };
        }
        return { ok: true };
      }

      // 注册收尾：可选设置用户名 → 跳转账户页
      async function finishSignup() {
        var uname = $('signup-username').value.trim();
        if (uname) {
          var ur = await User.setUsername(uname);
          if (!ur.ok) { setMsg('注册成功，但用户名设置失败：' + ur.message, true); return; }
        }
        setMsg('注册成功，正在跳转…');
        setTimeout(function () { window.location.href = 'account.html'; }, 600);
      }

      // 注册：第一步资料 + Turnstile → signUp 发送验证码 → 切第二步输入验证码
      $('signup-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        setMsg('');
        // 第二步可见时（验证码输入框按 Enter）转交验证码提交
        if (!$('signup-step2').classList.contains('hidden')) {
          $('signup-code-submit').click();
          return;
        }
        var p1 = $('signup-password').value;
        var p2 = $('signup-password2').value;
        if (p1 !== p2) { setMsg('两次输入的密码不一致', true); return; }
        if (!turnstileToken) { setMsg('请先完成人机验证', true); return; }
        var btn = $('signup-submit');
        btn.disabled = true;
        try {
          var tv = await verifyTurnstileToken();
          if (!tv.ok) { setMsg(tv.message, true); return; }
          var r = await Auth.signUp($('signup-email').value, p1);
          if (!r.ok) {
            // Supabase 原始错误（邮箱已注册 / 发送频率限制等）
            setMsg(r.message, true);
            return;
          }
          if (r.needsConfirm) {
            showSignupStep2($('signup-email').value);
            setMsg('验证码已发送，请查收邮件（含垃圾箱）');
            return;
          }
          // 兼容：个别配置下 signUp 直接登录
          await finishSignup();
        } finally {
          btn.disabled = false;
        }
      });

      // 提交验证码完成注册
      $('signup-code-submit').addEventListener('click', async function () {
        setMsg('');
        var code = $('signup-code').value.trim();
        if (!/^\d{8}$/.test(code)) { setMsg('请输入邮件中的 8 位数字验证码', true); return; }
        var btn = $('signup-code-submit');
        btn.disabled = true;
        try {
          var r = await Auth.verifyEmailOtp(signupEmail, code);
          if (!r.ok) { setMsg(r.message, true); return; }
          await finishSignup();
        } finally {
          btn.disabled = false;
        }
      });

      // 验证码输入框回车提交
      $('signup-code').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          $('signup-code-submit').click();
        }
      });

      // 重新发送验证码：重新走 Turnstile 防刷 → resend
      $('signup-resend').addEventListener('click', async function () {
        setMsg('');
        var btn = $('signup-resend');
        btn.disabled = true;
        var tv = await verifyTurnstileToken().catch(function () { return { ok: false, message: '网络异常，请重试' }; });
        if (!tv.ok) { setMsg(tv.message, true); btn.disabled = false; return; }
        var r = await Auth.resendSignupCode(signupEmail).catch(function () { return { ok: false, message: '网络异常，请重试' }; });
        if (!r.ok) { setMsg(r.message, true); btn.disabled = false; return; }
        setMsg('验证码已重新发送，请查收');
        startResendCountdown();
      });

      // 返回修改：回到第一步重新填资料（重置人机验证）
      $('signup-back').addEventListener('click', function () {
        $('signup-step2').classList.add('hidden');
        $('signup-step1').classList.remove('hidden');
        setMsg('');
        clearInterval(resendTimer);
        if (turnstileRendered) turnstile.reset(turnstileWidgetEl);
      });

      // ---- 找回密码：新密码只保留在当前页面内存，OTP 验证成功后才提交给 Supabase ----
      var forgotEmail = '';
      var forgotNewPassword = '';
      var forgotResendTimer = null;

      function startForgotResendCountdown() {
        var btn = $('forgot-resend');
        var remain = 60;
        btn.disabled = true;
        btn.textContent = '重新发送（' + remain + 's）';
        clearInterval(forgotResendTimer);
        forgotResendTimer = setInterval(function () {
          remain -= 1;
          if (remain <= 0) {
            clearInterval(forgotResendTimer);
            btn.disabled = false;
            btn.textContent = '重新发送验证码';
          } else {
            btn.textContent = '重新发送（' + remain + 's）';
          }
        }, 1000);
      }

      function showForgotStep2(email, password) {
        forgotEmail = email.trim().toLowerCase();
        forgotNewPassword = password;
        $('forgot-step1').classList.add('hidden');
        $('forgot-step2').classList.remove('hidden');
        $('forgot-code-email').textContent = forgotEmail;
        $('forgot-code').value = '';
        $('forgot-code').focus();
        startForgotResendCountdown();
      }

      $('forgot-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        setMsg('');
        if (!$('forgot-step2').classList.contains('hidden')) {
          $('forgot-code-submit').click();
          return;
        }
        var email = $('forgot-email').value;
        var p1 = $('forgot-password').value;
        var p2 = $('forgot-password2').value;
        if (!/^\S+@\S+\.\S+$/.test(email.trim())) { setMsg('请输入有效的邮箱地址', true); return; }
        if (p1.length < 6) { setMsg('新密码至少需要 6 位', true); return; }
        if (p1 !== p2) { setMsg('两次输入的新密码不一致', true); return; }
        var btn = $('forgot-submit');
        btn.disabled = true;
        try {
          var r = await Auth.resetPasswordForEmail(email);
          if (!r.ok) { setMsg(r.message, true); return; }
          showForgotStep2(email, p1);
          setMsg('验证码已发送，请查收邮件（含垃圾箱）');
        } finally {
          btn.disabled = false;
        }
      });

      $('forgot-code-submit').addEventListener('click', async function () {
        setMsg('');
        var code = $('forgot-code').value.trim();
        if (!/^\d{8}$/.test(code)) { setMsg('请输入邮件中的 8 位数字验证码', true); return; }
        if (!forgotEmail || !forgotNewPassword) { setMsg('找回信息已失效，请返回重新填写', true); return; }
        var btn = $('forgot-code-submit');
        btn.disabled = true;
        try {
          var verified = await Auth.verifyRecoveryOtp(forgotEmail, code);
          if (!verified.ok) { setMsg(verified.message, true); return; }
          var updated = await Auth.updatePassword(forgotNewPassword);
          if (!updated.ok) { setMsg(updated.message, true); return; }
          forgotNewPassword = '';
          $('forgot-password').value = '';
          $('forgot-password2').value = '';
          $('forgot-code').value = '';
          await Auth.signOut();
          $('login-email').value = forgotEmail;
          $('forgot-step2').classList.add('hidden');
          $('forgot-step1').classList.remove('hidden');
          clearInterval(forgotResendTimer);
          document.querySelector('.auth-tab[data-mode="login"]').click();
          setMsg('密码修改成功，请使用新密码登录');
          $('login-password').focus();
        } finally {
          btn.disabled = false;
        }
      });

      $('forgot-code').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          $('forgot-code-submit').click();
        }
      });

      $('forgot-resend').addEventListener('click', async function () {
        setMsg('');
        var btn = $('forgot-resend');
        btn.disabled = true;
        var r = await Auth.resetPasswordForEmail(forgotEmail).catch(function () { return { ok: false, message: '网络异常，请重试' }; });
        if (!r.ok) { setMsg(r.message, true); btn.disabled = false; return; }
        setMsg('验证码已重新发送，请查收');
        startForgotResendCountdown();
      });

      $('forgot-back').addEventListener('click', function () {
        $('forgot-step2').classList.add('hidden');
        $('forgot-step1').classList.remove('hidden');
        $('forgot-code').value = '';
        forgotNewPassword = '';
        clearInterval(forgotResendTimer);
        setMsg('');
      });

      // URL 带 mode 参数时直接切 tab（如从回调页跳回）
      var m = new URLSearchParams(window.location.search).get('mode');
      if (m === 'signup' || m === 'forgot') {
        document.querySelector('.auth-tab[data-mode="' + m + '"]').click();
      }
    })();
  </script>
</body>
</html>
